# wiring/Transistor.java
#
transistorNDrain = drenaj: düşük bir kaynak drenajı aşağıya çeker (yalnızca kapı yüksek olduğunda)
transistorNGate = kapı: yüksek olduğunda akımın transistörden geçmesine izin verir
transistorNSource = kaynak: düşük bir kaynak drenajı düşük seviyeye çeker (yalnızca kapı yüksek olduğunda)
transistorPDrain = drenaj: yüksek bir kaynak drenajı yükseğe çeker (yalnızca kapı alçak olduğunda)
transistorPGate = kapı (gate): düşük (0) olduğunda transistörden akım geçmesine izin verir
transistorPSource = kaynak (source): yüksek (1) kaynak, savak (drain) ucunu yükseğe çeker (yalnızca kapı düşükken)
transistorTypeAttr = Tip
transistorTypeN = N-Tipi
transistorTypeP = P-Tipi
#
# wiring/TransmissionGate.java
#
transmissionGateDrain = savak (drain): p-kapısı ve n-kapısına bağlı olarak kaynak tarafından kontrol edilir
transmissionGateNGate = n-geçidi: düşük olduğunda, düşük kaynağın drenaja geçmesine izin verir
transmissionGatePGate = p-geçidi: yüksek olduğunda, yüksek kaynağın drenaja geçmesine izin verir
transmissionGateSource = kaynak: p kapısı ve n kapısına bağlı olarak drenajı kontrol eder
