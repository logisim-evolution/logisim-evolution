clockCoarseDescriptionLow = Veriler yalnızca saat düşük olduğunda sürekli olarak yakalanır; yayılma sırasında veya saat yüksekken meydana gelebilecek geçici sinyal dalgalanmaları göz ardı edilir. Saat düşük olduğunda yapılan değişiklikler, geçit gecikmesi %smış gibi kaydedilir ve her saat döngüsü, sanki döngü başına %s (tik başına %s) almış gibi kaydedilir.
