realFineDescription = Los datos se capturan de forma continua, siempre que el simulador esté activado, incluidas las fluctuaciones transitorias de las señales. Cada segundo de tiempo real se registra como %s de tiempo simulado del circuito.
clockTime = Modo sincronizado con el reloj
clockCoarse = Resumen simplificado
clockCoarseDescriptionDual = Los datos se capturan en cada transición del reloj, ignorando las fluctuaciones transitorias que puedan producirse entre transiciones o durante la propagación. Cada ciclo de reloj se registra como si durara %s (%s por tick).
clockCoarseDescriptionRising = Los datos se capturan en cada flanco de subida del reloj, ignorando las fluctuaciones transitorias que puedan producirse entre transiciones o durante la propagación. Cada ciclo de reloj se registra como si durara %s (%s por tick).
clockCoarseDescriptionFalling = Los datos se capturan en cada flanco de bajada del reloj, ignorando las fluctuaciones transitorias que puedan producirse entre transiciones o durante la propagación. Cada ciclo de reloj se registra como si durara %s (%s por tick).
clockCoarseDescriptionHigh = Los datos se capturan de forma continua solo mientras el reloj está a nivel alto, ignorando las fluctuaciones transitorias que puedan producirse durante la propagación o mientras el reloj está a nivel bajo. Los cambios con el reloj a nivel alto se registran como si el retardo de puerta fuera de %s, y cada ciclo de reloj se registra como si durara %s (%s por tick).
clockCoarseDescriptionLow = Los datos se capturan de forma continua solo mientras el reloj está a nivel bajo, ignorando las fluctuaciones transitorias que puedan producirse durante la propagación o mientras el reloj está a nivel alto. Los cambios con el reloj a nivel bajo se registran como si el retardo de puerta fuera de %s, y cada ciclo de reloj se registra como si durara %s (%s por tick).
clockFine = Detalle completo
clockFineDescription = Los datos se capturan cada vez que cambia el valor de cualquier señal, incluidas las fluctuaciones transitorias que puedan producirse durante la propagación. Las fluctuaciones transitorias se registran como si el retardo de puerta fuera de %s, y cada ciclo de reloj se registra como si durara %s (%s por tick).
