# This workflow triggers on workflow_run once fork-pr-build finishes, so it runs 
# in the base repository's trusted context with secrets available. It looks up the
# PR, downloads the build output, checks out the fork's code without executing it,
# and runs the scan.
name: "Fork PR Sonar analysis"

on:
  workflow_run:
    workflows: ["Fork PR build and tests"]
    types: [completed]

jobs:
  sonar:
    name: "SonarQube analysis"
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    # Read-only on purpose: the artifacts expire on their own (retention-days in
    # fork-pr-build), and SonarCloud's GitHub App, not this token, comments on the PR.
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
    # The fork controls everything fork-pr-build uploads, so the PR is looked up
    # from the workflow_run event, which GitHub fills in, rather than from an artifact.
    - name: "Find the pull request"
      id: pr-info
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const run = context.payload.workflow_run;
          const { data: prs } = await github.rest.pulls.list({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: "open",
            head: `${run.head_repository.owner.login}:${run.head_branch}`,
          });
          // If the fork pushed again since this build, the newer run handles it.
          const pr = prs.find((p) => p.head.sha === run.head_sha);
          if (!pr) {
            core.setFailed(`No open pull request has ${run.head_sha} as its head`);
            return;
          }
          // These values end up on the scanner's command line.
          const safeRef = /^[A-Za-z0-9\/_.-]+$/;
          if (!safeRef.test(pr.head.ref) || !safeRef.test(pr.base.ref)) {
            core.setFailed("Unexpected characters in branch name");
            return;
          }
          core.setOutput("pr-number", pr.number);
          core.setOutput("head-sha", run.head_sha);
          core.setOutput("head-ref", pr.head.ref);
          core.setOutput("base-ref", pr.base.ref);

    - name: "Checkout sources"
      uses: actions/checkout@v7
      with:
        ref: ${{ steps.pr-info.outputs.head-sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: "Download compiled classes"
      uses: actions/download-artifact@v4.1.3
      with:
        pattern: build-output-*
        # The artifact's root is build/, so it has to be extracted there.
        path: build
        merge-multiple: true
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    # The fork can add its own sonar-project.properties, or slip one into the build
    # output, to change the scanner's settings (such as the server the token is sent
    # to). The scan is pointed at an empty settings file instead, and the server URL
    # is set on the command line, which takes precedence over any settings file.
    - name: "Create empty Sonar settings file"
      run: touch "$RUNNER_TEMP/empty-sonar.properties"

    # Do not replace this action with './gradlew sonar': it would execute
    # fork-provided Gradle code in a workflow that has access to secrets.
    - name: "Run SonarQube analysis"
      uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dproject.settings=${{ runner.temp }}/empty-sonar.properties
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.projectKey=logisim-evolution_logisim-evolution
          -Dsonar.organization=logisim-evolution
          -Dsonar.sources=src/main/java,build/generated/logisim/java
          -Dsonar.tests=src/test/java
          -Dsonar.java.source=21
          -Dsonar.java.binaries=build/classes/java/main
          -Dsonar.java.test.binaries=build/classes/java/test
          -Dsonar.java.libraries=build/sonar-libs/main/*.jar
          -Dsonar.java.test.libraries=build/classes/java/main,build/classes/java/docgen,build/sonar-libs/test/*.jar
          -Dsonar.pullrequest.key=${{ steps.pr-info.outputs.pr-number }}
          -Dsonar.pullrequest.branch=${{ steps.pr-info.outputs.head-ref }}
          -Dsonar.pullrequest.base=${{ steps.pr-info.outputs.base-ref }}
          -Dsonar.pullrequest.provider=github
          -Dsonar.pullrequest.github.repository=${{ github.repository }}
          -Dsonar.scm.revision=${{ steps.pr-info.outputs.head-sha }}
